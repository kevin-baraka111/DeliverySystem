<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - SmartShop</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <h1>SmartShop</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <!-- PRODUCTS SECTION -->

    <section class="products">
      <h2>Our Products</h2>

      <div class="product-container">
        <!-- PRODUCT 1 -->

        <div class="product-card">
          <img src="images/shoes.png" alt="Shoes" />

          <h3>Sports Shoes</h3>

          <p>Ksh 2500</p>

          <button onclick="addToCart('Sports shoes', 2500)">Add to Cart</button>
        </div>

        <!-- PRODUCT 2 -->

        <div class="product-card">
          <img src="images/headphones.jpg" alt="Headphones" />

          <h3>Wireless Headphones</h3>

          <p>Ksh 3500</p>

          <button onclick="addToCart('Wireless Headphones', 3500)">
            Add to Cart
          </button>
        </div>

        <!-- PRODUCT 3 -->

        <div class="product-card">
          <img src="images/watches.jpg" alt="Watch" />

          <h3>Smart Watch</h3>

          <p>Ksh 5000</p>

          <button onclick="addToCart('Smart watch', 5000)">Add to Cart</button>
        </div>
      </div>
    </section>

    <script src="js/app.js"></script>
  </body>
</html>
