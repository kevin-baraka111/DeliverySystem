<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - SmartShop</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->

    <header>
      <h1>Admin Dashboard</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <button id="theme-toggle">🌙</button>
      </nav>
    </header>

    <!-- ADMIN SECTION -->

    <section class="admin-section">
      <h2>Dashboard Overview</h2>

      <div class="dashboard-cards">
        <div class="dashboard-card">
          <h3>Products</h3>
          <p id="total-products">0</p>
        </div>

        <div class="dashboard-card">
          <h3>Orders</h3>
          <p id="total-orders">8</p>
        </div>

        <div class="dashboard-card">
          <h3>Revenue</h3>
          <p id="total-revenue">KES 15,000</p>
        </div>

        <div class="dashboard-card">
          <h3>Pending Deliveries</h3>
          <p id="pending-deliveries">3</p>
        </div>
      </div>

      <h2>Add Product</h2>

      <form id="admin-form">
        <input
          type="text"
          id="product-name"
          placeholder="Product Name"
          required
        />

        <input
          type="number"
          id="product-price"
          placeholder="Product Price"
          required
        />

        <input
          type="text"
          id="product-image"
          placeholder="Image Path (example: images/shoes.jpg)"
          required
        />

        <button type="submit">Add Product</button>
      </form>
      <br /><br />

      <!-- PRODUCT LIST -->

      <h2>Manage Products</h2>

      <input type="text" id="search-product" placeholder="Search product..." />

      <div id="admin-products"></div>
    </section>

    <script src="js/app.js"></script>
  </body>
</html>
